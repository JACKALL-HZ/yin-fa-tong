<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{font-family:"Noto Sans SC",system-ui,sans-serif;background:#1A1814}

  /* 主导航 */
  .master-nav{position:fixed;top:0;left:0;right:0;z-index:9999;height:72px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#1F4D3A 0%,#2F6B53 100%);border-bottom:3px solid #C28840;box-shadow:0 6px 24px rgba(0,0,0,.25)}

  .brand{display:flex;flex-direction:column;gap:2px;flex-shrink:0}
  .brand .zh{font-family:"Noto Serif SC",serif;font-weight:900;font-size:24px;color:#FFF7E8;letter-spacing:3px;line-height:1}
  .brand .en{font-family:"DM Serif Display",serif;font-style:italic;font-size:11px;color:#C28840;letter-spacing:2px}
  .brand .stamp{display:inline-block;font-family:"Ma Shan Zheng",cursive;font-size:14px;color:#FFF7E8;background:#B8451F;padding:2px 8px;border-radius:4px;margin-left:8px;transform:rotate(-2deg);letter-spacing:1px}
  .tabs{display:flex;gap:6px;height:100%;align-items:center}
  .tab{display:flex;align-items:center;gap:8px;padding:10px 18px;cursor:pointer;color:rgba(255,247,232,.65);font-size:14px;font-weight:700;border-radius:10px;transition:all .2s;border:1px solid transparent}
  .tab:hover{color:#FFF7E8;background:rgba(255,247,232,.08);border-color:rgba(255,247,232,.15)}
  .tab.active{color:#FFF7E8;background:#B8451F;border-color:rgba(255,247,232,.25);box-shadow:0 4px 14px -4px rgba(184,69,31,.6)}
  .tab .num{font-family:"Bebas Neue";font-size:18px;letter-spacing:1px;opacity:.85}
  .tab.active .num{color:#E0A55A;opacity:1}
  .right{display:flex;align-items:center;gap:18px;flex-shrink:0}
  .right .meta{font-size:12px;color:rgba(255,247,232,.7);text-align:right;line-height:1.5}
  .right .meta b{color:#E0A55A;font-family:"Bebas Neue";font-size:18px;letter-spacing:1px;display:block}
  .right .seal{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle,#B8451F,#8E3215);color:#FFF7E8;display:flex;align-items:center;justify-content:center;font-family:"Ma Shan Zheng",cursive;font-size:14px;line-height:1;text-align:center;transform:rotate(-8deg);box-shadow:0 4px 12px -4px rgba(0,0,0,.4);border:2px solid rgba(255,247,232,.2)}

  /* 状态条 */
  .status-bar{position:fixed;top:72px;left:0;right:0;z-index:9998;height:32px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;background:rgba(26,24,20,.92);backdrop-filter:blur(10px);border-bottom:1px solid rgba(194,136,64,.3);color:rgba(255,247,232,.75);font-size:12px;font-weight:700}
  .status-bar .left{display:flex;gap:18px;align-items:center}
  .status-bar .live{display:flex;align-items:center;gap:6px;color:#E0A55A}
  .status-bar .live::before{content:"";width:6px;height:6px;background:#E0A55A;border-radius:50%;animation:pulse 1.5s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .status-bar .right{font-family:"DM Serif Display",serif;font-style:italic}

  /* 主内容 */
  .pages{position:absolute;top:104px;left:0;right:0;bottom:0;background:#F5EBD8}
  iframe{width:100%;height:100%;border:0;background:#F5EBD8;display:none}
  iframe.active{display:block}

  /* 加载占位 */
  .loader{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#F5EBD8;flex-direction:column;gap:14px;color:#6B6358;font-size:14px}
  .loader .spin{width:36px;height:36px;border:3px solid #E5D7BC;border-top-color:#B8451F;border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

  <nav class="master-nav">
    <div class="brand">
      <span class="zh">银发通<span class="stamp">全集</span></span>
      <span class="en">YINFA-TONG · COMPLETE DESIGN SET</span>
    </div>
    <div class="tabs">

      <div class="tab" data-target="frame-family"><span class="num">05</span><span class="lbl">子女端后台</span></div>
      <div class="tab" data-target="frame-queue"><span class="num">06</span><span class="lbl">候诊叫号屏</span></div>

    <div class="right">

  <div class="status-bar">

      <span>适老化就医服务设计稿 · 数字鸿沟解决方案</span>
    </div>
    <div class="right">6 pages · click tab to switch</div>
  </div>

  <div class="pages">
    <iframe id="frame-v2" name="v2" title="首页 v3 饱满版"></iframe>
    <iframe id="frame-flow" name="flow" title="挂号 4 步流程"></iframe>
    <iframe id="frame-doctor" name="doctor" title="专家详情"></iframe>
    <iframe id="frame-accompany" name="accompany" title="陪诊预约"></iframe>
    <iframe id="frame-family" name="family" title="子女端后台"></iframe>
    <iframe id="frame-queue" name="queue" title="候诊叫号屏"></iframe>
  </div>

  <script>
    const templates = {
    "frame-v2": `<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>银发通 · 长者就医服务平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;800;900&family=Noto+Serif+SC:wght@500;700;900&family=Ma+Shan+Zheng&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,500&family=Bebas+Neue&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    /* 主色：温暖赭红 + 墨绿 + 焦糖 + 暖米 */
    --c-bg:       #F5EBD8;  /* 焦糖米 */
    --c-paper:    #FFFCF5;  /* 暖纸白 */
    --c-paper-2:  #F9F0DC;  /* 牛皮纸 */
    --c-ink-900:  #1A1814;
    --c-ink-700:  #3D3830;
    --c-ink-500:  #6B6358;
    --c-ink-300:  #A89F8E;
    --c-line:     #D8C8A8;
    --c-line-2:   #C4B190;

    --c-primary:  #B8451F;  /* 深赭红 */
    --c-primary-d:#8C2F12;
    --c-primary-l:#F4D9C7;
    --c-primary-bg:#FBEEE5;

    --c-accent:   #1F4D3A;  /* 深墨绿 */
    --c-accent-d: #0F2E22;
    --c-accent-l: #D1DDD3;
    --c-accent-bg:#E5EDE6;

    --c-gold:     #C28840;  /* 焦糖金 */
    --c-gold-l:   #F2DDB0;
    --c-gold-bg:  #FAEED3;

    --c-cream:    #EDD9A8;  /* 奶油 */
    --c-rose:     #D87056;
    --c-sky:      #6E8A99;  /* 雾蓝点缀 */
    --c-berry:    #7B2D3A;  /* 浆果深红 */

    --r-sm: 8px;
    --r-md: 14px;
    --r-lg: 22px;
    --r-xl: 32px;
    --r-pill: 999px;
    --shadow-1: 0 1px 2px rgba(28,24,20,.04), 0 6px 18px rgba(28,24,20,.06);
    --shadow-2: 0 2px 4px rgba(28,24,20,.06), 0 14px 36px rgba(28,24,20,.10);
    --shadow-3: 0 4px 8px rgba(28,24,20,.08), 0 24px 60px rgba(28,24,20,.14);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--c-bg); color: var(--c-ink-900); }
  body {
    font-family: "Noto Sans SC", "PingFang SC", sans-serif;
    font-weight: 500;
    font-size: 17px;
    line-height: 1.7;
    background:
      radial-gradient(1100px 700px at 0% 0%, rgba(194,136,64,.10), transparent 60%),
      radial-gradient(900px 600px at 100% 0%, rgba(184,69,31,.07), transparent 60%),
      radial-gradient(800px 600px at 50% 100%, rgba(31,77,58,.06), transparent 60%),
      var(--c-bg);
    min-height: 100vh;
  }

  .container { max-width: 1320px; margin: 0 auto; padding: 32px 32px 80px; }

  /* 标题字体 */
  .serif { font-family: "Noto Serif SC", "Songti SC", serif; }
  .brush { font-family: "Ma Shan Zheng", "Noto Serif SC", serif; }
  .display { font-family: "DM Serif Display", "Noto Serif SC", serif; font-style: italic; }
  .num { font-family: "Bebas Neue", "Noto Sans SC", sans-serif; letter-spacing: 1px; }

  /* ============ 顶部运营条 ============ */
  .topbar {
    display: flex; align-items: center; gap: 16px;
    padding: 10px 20px;
    background: var(--c-ink-900); color: var(--c-cream);
    border-radius: var(--r-pill);
    font-size: 14px; font-weight: 500;
    margin-bottom: 20px;
  }
  .topbar .marquee { flex: 1; display: flex; align-items: center; gap: 10px; overflow: hidden; }
  .topbar .marquee-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--c-gold); box-shadow: 0 0 0 4px rgba(194,136,64,.25);
    animation: blink 1.6s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.4} }
  .topbar b { color: var(--c-gold-l); font-weight: 700; }
  .topbar .item { display: flex; align-items: center; gap: 6px; color: var(--c-cream); opacity: .85; }
  .topbar .item:hover { opacity: 1; }

  /* ============ 主导航 ============ */
  .nav {
    display: flex; align-items: center; gap: 36px;
    padding: 16px 0 24px; border-bottom: 1px solid var(--c-line);
    margin-bottom: 32px;
  }
  .nav-logo { display: flex; align-items: center; gap: 12px; }
  .nav-logo .icon {
    width: 48px; height: 48px;
    background: var(--c-primary); color: var(--c-cream);
    display: flex; align-items: center; justify-content: center;
    border-radius: 14px; font-family: "Noto Serif SC", serif;
    font-weight: 900; font-size: 24px;
    box-shadow: var(--shadow-1);
    position: relative;
  }
  .nav-logo .icon::after {
    content: ""; position: absolute; inset: -4px;
    border: 1.5px dashed var(--c-gold);
    border-radius: 18px; opacity: .5;
  }
  .nav-logo .name {
    font-family: "Noto Serif SC", serif; font-weight: 900;
    font-size: 24px; letter-spacing: 2px; color: var(--c-ink-900);
  }
  .nav-logo .name span { color: var(--c-primary); }
  .nav-logo .sub {
    font-family: "Fraunces", serif; font-style: italic; font-size: 11px;
    color: var(--c-ink-500); letter-spacing: 1.5px; margin-top: 2px;
  }
  .nav-menu { display: flex; gap: 28px; }
  .nav-menu a {
    color: var(--c-ink-700); font-weight: 600; font-size: 16px;
    text-decoration: none; padding: 6px 0; position: relative;
  }
  .nav-menu a.active { color: var(--c-primary); }
  .nav-menu a.active::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -27px;
    height: 3px; background: var(--c-primary);
    border-radius: 2px;
  }
  .nav-menu a .new {
    font-size: 10px; padding: 2px 6px; background: var(--c-primary);
    color: var(--c-cream); border-radius: 6px; margin-left: 4px;
    font-weight: 700; vertical-align: top;
  }
  .nav-tools { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .nav-search {
    width: 240px; padding: 10px 16px 10px 40px;
    background: var(--c-paper); border: 1px solid var(--c-line);
    border-radius: var(--r-pill); font-size: 14px; color: var(--c-ink-700);
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23A89F8E' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><circle cx='11' cy='11' r='7'/><line x1='21' y1='21' x2='16.5' y2='16.5'/></svg>");
    background-repeat: no-repeat; background-position: 16px center;
  }
  .nav-btn {
    padding: 10px 22px; border-radius: var(--r-pill);
    background: var(--c-ink-900); color: var(--c-cream);
    font-weight: 700; font-size: 14px; border: none;
  }
  .nav-btn.ghost { background: transparent; color: var(--c-ink-700); border: 1px solid var(--c-line-2); }

  /* ============ Hero 区（不对称）============ */
  .hero {
    display: grid; grid-template-columns: 1.4fr 1fr; gap: 24px;
    margin-bottom: 56px;
  }
  .hero-left {
    position: relative; padding: 56px 48px 48px;
    background: var(--c-ink-900); color: var(--c-cream);
    border-radius: var(--r-xl); overflow: hidden;
  }
  .hero-left::before {
    content: ""; position: absolute; top: -100px; right: -100px;
    width: 360px; height: 360px; border-radius: 50%;
    background: radial-gradient(circle, rgba(194,136,64,.3), transparent 60%);
  }
  .hero-left::after {
    content: "長"; position: absolute; bottom: -80px; right: 24px;
    font-family: "Noto Serif SC", serif; font-size: 280px; font-weight: 900;
    color: rgba(237,217,168,.05); line-height: 1;
  }
  .hero-date {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(237,217,168,.12); color: var(--c-gold-l);

  .hero-greet {

  .hero-greet .brush {

  .hero-tip {
    font-size: 16px; line-height: 1.8; opacity: .8; max-width: 480px; margin-bottom: 32px;
  }
  .hero-cta { display: flex; gap: 12px; flex-wrap: wrap; position: relative; }

  .hero-stats {

  .hero-stat .n {

  /* Hero 右侧运营位 */
  .hero-right { display: flex; flex-direction: column; gap: 16px; }

  .voice-card {
    position: relative; padding: 24px 28px;
    background: var(--c-primary); color: var(--c-cream);
    border-radius: var(--r-xl); overflow: hidden;
    box-shadow: var(--shadow-2);
  }

    content: ""; position: absolute; inset: 0;
    background: radial-gradient(120% 80% at 100% 0%, rgba(255,255,255,.15), transparent 50%);
  }
  .voice-card .row { display: flex; align-items: center; gap: 16px; position: relative; }
  .voice-card .mic {
    width: 72px; height: 72px; border-radius: 50%;

  }
  .svc .ico {

  .svc .desc { font-size: 13px; color: var(--c-ink-500); margin-top: 4px; }

  .svc.big {
    grid-column: span 1; grid-row: span 2;
    background: var(--c-primary-bg);
    border: 1px solid var(--c-primary-l);

  .svc.big .ico { width: 72px; height: 72px; background: var(--c-primary); color: var(--c-cream); }

  .svc.big .desc { font-size: 14px; }

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;800;900&family=Noto+Serif+SC:wght@500;700;900&family=Ma+Shan+Zheng&family=Bebas+Neue&family=DM+Serif+Display:ital@0;1&family=Fraunces:ital,opsz,wght@1,144,600;1,144,800&display=swap" rel="stylesheet">
<style>
  :root{
    --c-primary:#B8451F;
    --c-primary-dark:#8E3215;
    --c-accent:#1F4D3A;
    --c-accent-2:#2F6B53;
    --c-gold:#C28840;
    --c-gold-2:#E0A55A;
    --c-bg:#F5EBD8;
    --c-paper:#FFFCF5;
    --c-paper-2:#FAF1E0;
    --c-ink-900:#1A1814;
    --c-ink-700:#3D372F;
    --c-ink-500:#6B6358;
    --c-ink-300:#A89E8E;
    --c-line:#E5D7BC;
    --c-line-2:#D4C29E;
    --c-danger:#C0392B;
    --r-md:14px;
    --r-lg:22px;
    --r-xl:32px;
    --r-pill:999px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--c-bg);color:var(--c-ink-900);font-family:"Noto Sans SC",system-ui,sans-serif;font-weight:500}
  body{background-image:radial-gradient(1200px 600px at 80% -10%,#EBD5B0 0%,transparent 60%),radial-gradient(800px 500px at -10% 100%,#E8D7B5 0%,transparent 50%)}
  .wrap{max-width:1380px;margin:0 auto;padding:48px 36px 80px}

  /* ─── 顶部装饰条 ─── */
  .top-rail{display:flex;align-items:center;justify-content:space-between;padding-bottom:14px;border-bottom:1px dashed var(--c-line-2);font-size:14px;color:var(--c-ink-500)}
  .top-rail .left{display:flex;gap:18px;align-items:center}
  .top-rail .stamp{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--c-line-2);border-radius:6px;background:var(--c-paper)}
  .top-rail .stamp::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c-primary)}
  .top-rail .right{display:flex;gap:18px;align-items:center;font-family:"DM Serif Display",serif;font-style:italic}
  .top-rail .right b{color:var(--c-primary);font-style:normal;font-family:"Bebas Neue",sans-serif;letter-spacing:1px;font-size:18px}

  /* ─── 页头 ─── */
  .page-head{display:grid;grid-template-columns:1.4fr 1fr;gap:32px;align-items:end;margin:30px 0 28px}
  .ph-title{font-family:"Noto Serif SC",serif;font-weight:900;font-size:54px;line-height:1.05;color:var(--c-ink-900);letter-spacing:-1px}
  .ph-title em{font-family:"Fraunces",serif;font-style:italic;font-weight:600;color:var(--c-primary);padding:0 4px}
  .ph-title .seal{display:inline-block;font-family:"Ma Shan Zheng",cursive;font-size:46px;color:var(--c-primary);transform:rotate(-6deg);margin:0 8px -8px;letter-spacing:4px}
  .ph-sub{margin-top:14px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;color:var(--c-ink-500);font-size:15px}
  .ph-sub .dot{width:5px;height:5px;background:var(--c-gold);border-radius:50%}
  .ph-meta{background:var(--c-paper);border:1px solid var(--c-line);border-radius:var(--r-lg);padding:18px 22px;position:relative;overflow:hidden}
  .ph-meta::before{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;background:radial-gradient(circle,rgba(194,136,64,.18),transparent 70%)}
  .ph-meta h5{font-family:"Noto Serif SC",serif;font-size:18px;color:var(--c-ink-900);margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .ph-meta h5::before{content:"";width:18px;height:2px;background:var(--c-primary)}
  .ph-meta .row{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;color:var(--c-ink-700);border-top:1px dashed var(--c-line)}
  .ph-meta .row:first-of-type{border-top:0}
  .ph-meta .row b{color:var(--c-primary);font-family:"Bebas Neue";letter-spacing:1px;font-size:18px}

  /* ─── 4 步进度条 ─── */
  .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;background:var(--c-paper);border:1px solid var(--c-line);border-radius:var(--r-lg);padding:0;position:relative;overflow:hidden;margin-bottom:36px}
  .step{padding:24px 24px 22px;position:relative;border-right:1px dashed var(--c-line)}
  .step:last-child{border-right:0}
  .step::after{content:"";position:absolute;right:-10px;top:50%;width:18px;height:18px;background:var(--c-paper);border:1px solid var(--c-line);border-radius:50%;transform:translateY(-50%) rotate(45deg);z-index:2}
  .step:last-child::after{display:none}
  .step .num{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
  .step .num b{font-family:"Bebas Neue";font-size:46px;color:var(--c-ink-300);letter-spacing:1px;line-height:1}
  .step.done .num b{color:var(--c-accent-2)}
  .step.now .num b{color:var(--c-primary)}
  .step .num em{font-family:"DM Serif Display",serif;font-style:italic;font-size:14px;color:var(--c-ink-500)}
  .step .name{font-family:"Noto Serif SC",serif;font-weight:900;font-size:24px;color:var(--c-ink-900);margin-bottom:4px}
  .step .desc{font-size:13px;color:var(--c-ink-500);line-height:1.5}
  .step.now{background:linear-gradient(180deg,#FFF7E8,transparent 60%)}
  .step.now::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--c-primary)}
  .step.now .name{color:var(--c-primary)}
  .step .tag{display:inline-block;margin-top:10px;padding:3px 10px;border-radius:var(--r-pill);font-size:12px;font-weight:700}
  .step.done .tag{background:#E8F1ED;color:var(--c-accent)}
  .step.now .tag{background:var(--c-primary);color:#FFF7E8}
  .step.todo .tag{background:var(--c-paper-2);color:var(--c-ink-500)}

  /* ─── 主舞台 ─── */
  .stage{display:grid;grid-template-columns:1.5fr 1fr;gap:24px}
  .card{background:var(--c-paper);border:1px solid var(--c-line);border-radius:var(--r-xl);padding:30px;position:relative;overflow:hidden}
  .card h3{font-family:"Noto Serif SC",serif;font-weight:900;font-size:30px;color:var(--c-ink-900);display:flex;align-items:center;gap:14px;margin-bottom:6px}
  .card h3 .en{font-family:"DM Serif Display",serif;font-style:italic;font-weight:400;font-size:18px;color:var(--c-primary);letter-spacing:1px}
  .card h3 .rec{font-family:"Ma Shan Zheng",cursive;font-size:24px;color:var(--c-primary);margin-left:6px}
  .card .lead{color:var(--c-ink-500);font-size:15px;margin-bottom:22px;display:flex;gap:14px;align-items:center}
  .card .lead::before{content:"";width:30px;height:1px;background:var(--c-gold)}

  /* 步骤1 — 选科室 */
  .depts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:8px}
  .dept{background:var(--c-paper-2);border:2px solid transparent;border-radius:var(--r-lg);padding:22px 18px;cursor:pointer;transition:all .2s;position:relative}
  .dept:hover{border-color:var(--c-gold-2);transform:translateY(-2px)}
  .dept.sel{background:#FFF;border-color:var(--c-primary);box-shadow:0 12px 28px -16px rgba(184,69,31,.4)}
  .dept.sel::after{content:"";position:absolute;right:14px;top:14px;width:24px;height:24px;background:var(--c-primary);border-radius:50%;background-image:radial-gradient(circle at 50% 55%,#FFF 0 4px,transparent 5px)}
  .dept .ico{width:52px;height:52px;background:#FFF;border:1px solid var(--c-line);border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
  .dept .ico svg{width:30px;height:30px}
  .dept h4{font-family:"Noto Serif SC",serif;font-weight:900;font-size:22px;color:var(--c-ink-900);margin-bottom:4px}
  .dept p{font-size:13px;color:var(--c-ink-500)}
  .dept .meta{display:flex;gap:8px;margin-top:10px}
  .dept .meta span{padding:2px 8px;background:#FFF;border:1px solid var(--c-line);border-radius:var(--r-pill);font-size:11px;color:var(--c-ink-700);font-weight:700}

  /* 步骤2 — 选医生 */
  .docs{display:flex;flex-direction:column;gap:12px}
  .doc{display:grid;grid-template-columns:80px 1fr auto;gap:18px;align-items:center;background:var(--c-paper-2);border:2px solid transparent;border-radius:var(--r-lg);padding:16px 20px;cursor:pointer;transition:all .2s}
  .doc:hover{border-color:var(--c-gold-2);background:#FFF}
  .doc.sel{background:#FFF;border-color:var(--c-primary);box-shadow:0 12px 28px -16px rgba(184,69,31,.4)}
  .doc .avatar{width:80px;height:80px;border-radius:50%;background-size:cover;background-position:center;border:3px solid #FFF;box-shadow:0 4px 12px -4px rgba(0,0,0,.15);position:relative}
  .doc .avatar::after{content:"";position:absolute;right:0;bottom:0;width:22px;height:22px;border-radius:50%;background:var(--c-accent);border:3px solid #FFF;display:flex;align-items:center;justify-content:center}
  .doc .avatar.tea::after{background:var(--c-gold)}
  .doc .info h4{font-family:"Noto Serif SC",serif;font-weight:900;font-size:24px;color:var(--c-ink-900);margin-bottom:2px;display:flex;align-items:center;gap:10px}
  .doc .info h4 em{font-family:"DM Serif Display",serif;font-style:italic;font-size:18px;color:var(--c-primary);font-weight:400}
  .doc .info .title{font-size:14px;color:var(--c-ink-700);margin-bottom:8px;display:flex;gap:8px;align-items:center}
  .doc .info .title span{padding:2px 8px;background:#FFF;border:1px solid var(--c-line);border-radius:4px;font-size:12px;color:var(--c-ink-700);font-weight:700}
  .doc .info .skill{font-size:13px;color:var(--c-ink-500);display:flex;gap:6px;flex-wrap:wrap}
  .doc .info .skill b{color:var(--c-primary-dark);font-weight:700;background:#FBE8D6;padding:1px 6px;border-radius:4px}
  .doc .right{text-align:right}
  .doc .right .price{font-family:"Bebas Neue";font-size:36px;color:var(--c-primary);letter-spacing:1px;line-height:1}
  .doc .right .price small{font-size:16px;color:var(--c-ink-500)}
  .doc .right .avail{margin-top:6px;font-size:13px;color:var(--c-accent);font-weight:700}
  .doc .right .avail::before{content:"●";margin-right:4px;font-size:10px}

  /* 步骤3 — 选时段 */
  .slots{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .slot{background:var(--c-paper-2);border:2px solid transparent;border-radius:var(--r-md);padding:16px 12px;text-align:center;cursor:pointer;transition:all .2s;position:relative}
  .slot:hover{border-color:var(--c-gold-2)}
  .slot.sel{background:#FFF;border-color:var(--c-primary);box-shadow:0 8px 20px -12px rgba(184,69,31,.4)}
  .slot .time{font-family:"Bebas Neue";font-size:26px;color:var(--c-ink-900);letter-spacing:1px}
  .slot .ampm{font-size:13px;color:var(--c-ink-500);margin-top:2px}
  .slot .rest{margin-top:8px;font-size:12px;font-weight:700;padding:2px 6px;border-radius:4px;display:inline-block}
  .slot .rest.ok{background:#E8F1ED;color:var(--c-accent)}
  .slot .rest.few{background:#FBE8D6;color:var(--c-primary)}
  .slot .rest.full{background:#EFE7D7;color:var(--c-ink-500)}
  .slot.full{opacity:.55;cursor:not-allowed}
  .slot.full .time,.slot.full .ampm{text-decoration:line-through;color:var(--c-ink-300)}

  /* 步骤4 — 支付 */
  .pay-card{background:linear-gradient(135deg,#1F4D3A,#2F6B53);color:#FFF7E8;border-radius:var(--r-xl);padding:28px;position:relative;overflow:hidden;margin-bottom:18px}
  .pay-card::before{content:"";position:absolute;right:-40px;top:-40px;width:200px;height:200px;background:radial-gradient(circle,rgba(194,136,64,.3),transparent 70%)}
  .pay-card::after{content:"";position:absolute;left:-20px;bottom:-30px;width:160px;height:160px;border:1px dashed rgba(255,247,232,.25);border-radius:50%}
  .pay-card .label{font-family:"DM Serif Display",serif;font-style:italic;font-size:18px;opacity:.7;letter-spacing:1px}
  .pay-card .amount{font-family:"Bebas Neue";font-size:84px;color:#FFF7E8;line-height:1;margin:8px 0 14px;letter-spacing:2px}
  .pay-card .amount small{font-size:24px;opacity:.7;margin-right:6px}
  .pay-card .break{display:flex;gap:18px;font-size:14px;opacity:.85;border-top:1px dashed rgba(255,247,232,.25);padding-top:14px;margin-top:6px}
  .pay-card .break b{font-family:"Bebas Neue";font-size:20px;color:var(--c-gold-2);letter-spacing:1px}
  .pay-card .stamp{position:absolute;right:24px;top:24px;width:78px;height:78px;border:2px solid var(--c-primary);border-radius:50%;color:var(--c-primary);display:flex;align-items:center;justify-content:center;text-align:center;transform:rotate(-12deg);font-family:"Ma Shan Zheng",cursive;font-size:18px;background:#FFF7E8;line-height:1.2}

  .pay-modes{display:flex;flex-direction:column;gap:10px;margin-top:14px}
  .pay-mode{display:grid;grid-template-columns:48px 1fr auto;gap:14px;align-items:center;background:var(--c-paper-2);border:2px solid transparent;border-radius:var(--r-md);padding:14px 18px;cursor:pointer}
  .pay-mode.sel{background:#FFF;border-color:var(--c-primary)}
  .pay-mode .ico{width:48px;height:48px;background:#FFF;border:1px solid var(--c-line);border-radius:12px;display:flex;align-items:center;justify-content:center}
  .pay-mode .ico svg{width:28px;height:28px}
  .pay-mode h5{font-family:"Noto Serif SC",serif;font-weight:900;font-size:18px;color:var(--c-ink-900)}
  .pay-mode p{font-size:13px;color:var(--c-ink-500)}
  .pay-mode .badge{padding:4px 10px;border-radius:var(--r-pill);background:var(--c-primary);color:#FFF7E8;font-size:12px;font-weight:700}
  .pay-mode .badge.ok{background:var(--c-accent)}

  /* 右侧 — 订单摘要 */
  .summary{background:var(--c-paper);border:1px solid var(--c-line);border-radius:var(--r-xl);padding:28px;position:sticky;top:24px}
  .summary h3{font-family:"Noto Serif SC",serif;font-weight:900;font-size:26px;color:var(--c-ink-900);margin-bottom:18px;display:flex;align-items:center;justify-content:space-between}
  .summary h3 .en{font-family:"DM Serif Display",serif;font-style:italic;font-size:15px;color:var(--c-primary);font-weight:400}
  .sum-block{background:var(--c-paper-2);border-radius:var(--r-md);padding:16px;margin-bottom:14px}
  .sum-block h6{font-size:12px;color:var(--c-ink-500);font-weight:700;letter-spacing:1px;margin-bottom:8px;display:flex;align-items:center;gap:6px;text-transform:uppercase}
  .sum-block h6::before{content:"";width:14px;height:2px;background:var(--c-primary)}
  .sum-block .v{font-family:"Noto Serif SC",serif;font-weight:900;font-size:20px;color:var(--c-ink-900)}
  .sum-block .sub{font-size:13px;color:var(--c-ink-500);margin-top:4px}
  .sum-doctor{display:flex;gap:12px;align-items:center;margin-top:10px}
  .sum-doctor .av{width:48px;height:48px;border-radius:50%;background-size:cover;background-position:center;border:2px solid #FFF;box-shadow:0 2px 8px -2px rgba(0,0,0,.15)}
  .sum-doctor .info b{font-family:"Noto Serif SC",serif;font-weight:900;font-size:17px;color:var(--c-ink-900);display:block}
  .sum-doctor .info span{font-size:12px;color:var(--c-ink-500)}
  .sum-timeline{margin:18px 0;padding:18px;background:linear-gradient(180deg,#FFF7E8,transparent);border-radius:var(--r-md);position:relative}
  .sum-timeline::before{content:"";position:absolute;left:24px;top:30px;bottom:30px;width:1px;background:var(--c-line-2)}
  .sum-timeline .item{display:flex;gap:14px;padding:6px 0;position:relative}
  .sum-timeline .item .dot{width:12px;height:12px;border-radius:50%;background:var(--c-line-2);border:2px solid #FFF;flex-shrink:0;margin-top:4px;z-index:1}
  .sum-timeline .item.done .dot{background:var(--c-accent)}
  .sum-timeline .item.now .dot{background:var(--c-primary);box-shadow:0 0 0 4px rgba(184,69,31,.2)}
  .sum-timeline .item b{font-family:"Noto Serif SC",serif;font-weight:900;font-size:15px;color:var(--c-ink-900);display:block}
  .sum-timeline .item span{font-size:12px;color:var(--c-ink-500)}
  .sum-total{display:flex;align-items:baseline;justify-content:space-between;padding:18px 0;border-top:1px dashed var(--c-line-2);margin-top:6px}
  .sum-total .label{font-size:14px;color:var(--c-ink-500)}
  .sum-total .label b{color:var(--c-primary);font-size:16px;font-weight:900}
  .sum-total .num{font-family:"Bebas Neue";font-size:48px;color:var(--c-primary);letter-spacing:1px;line-height:1}
  .sum-total .num small{font-size:18px;color:var(--c-ink-500);margin-right:4px}
  .cta{display:block;width:100%;padding:22px;background:var(--c-primary);color:#FFF7E8;border:0;border-radius:var(--r-lg);font-family:"Noto Serif SC",serif;font-weight:900;font-size:22px;cursor:pointer;margin-top:16px;position:relative;overflow:hidden;letter-spacing:2px}
  .cta::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.1),transparent 50%)}
  .cta:hover{background:var(--c-primary-dark)}
  .cta-aux{display:flex;gap:10px;margin-top:10px}
  .cta-aux button{flex:1;padding:14px;background:transparent;color:var(--c-ink-700);border:1px solid var(--c-line-2);border-radius:var(--r-md);font-size:14px;font-weight:700;cursor:pointer}
  .cta-aux button:hover{background:var(--c-paper-2);color:var(--c-primary)}

  /* ─── 提示条 ─── */
  .help-rail{margin-top:32px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .help{background:var(--c-paper);border:1px solid var(--c-line);border-radius:var(--r-lg);padding:18px 20px;display:flex;gap:14px;align-items:center}
  .help .ico{width:46px;height:46px;background:var(--c-paper-2);border:1px solid var(--c-line);border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .help .ico svg{width:24px;height:24px}
  .help b{font-family:"Noto Serif SC",serif;font-weight:900;font-size:16px;color:var(--c-ink-900);display:block;margin-bottom:2px}
  .help p{font-size:13px;color:var(--c-ink-500);line-height:1.5}

  /* ─── 页脚 ─── */
  .footer{margin-top:42px;padding-top:22px;border-top:1px dashed var(--c-line-2);display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--c-ink-500)}
  .footer .slogan{font-family:"Ma Shan Zheng",cursive;font-size:22px;color:var(--c-primary);letter-spacing:3px}
  .footer .meta{display:flex;gap:18px;align-items:center}
  .footer .meta em{font-family:"DM Serif Display",serif;font-style:italic}

  @media (max-width:1100px){
    .stage{grid-template-columns:1fr}
    .summary{position:static}
    .page-head{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- 顶部装饰条 -->
  <div class="top-rail">
    <div class="left">
      <span class="stamp">适老化就医服务</span>
      <span>·</span>
      <span>国家卫健委 2025 长者就医便利化行动</span>
    </div>
    <div class="right">
      <span>4-step booking flow</span>
      <b>银发通 / YINFA-TONG v3.0</b>
    </div>
  </div>

  <!-- 页头 -->
  <div class="page-head">
    <div>
      <h1 class="ph-title">
        一键挂号，<em>四步</em>搞定<br>
        <span class="seal">银发通</span>陪爸妈看病不再难
      </h1>
      <div class="ph-sub">
        <span>为 60+ 长者及亲友代办设计</span>
        <span class="dot"></span>
        <span>支持语音 / 大字 / 子女远程代办</span>
        <span class="dot"></span>
        <span>医保结算 + 长者专属号源</span>
      </div>
    </div>
    <div class="ph-meta">
      <h5>本次预约概览</h5>
      <div class="row"><span>就诊人</span><b>张秀英</b></div>
      <div class="row"><span>预约医院</span><b>北京协和医院（东院）</b></div>
      <div class="row"><span>预约日期</span><b>2026 / 06 / 25 周四</b></div>
      <div class="row"><span>代办人</span><b>女儿 · 思雨</b></div>
    </div>
  </div>

  <!-- 4 步进度条 -->
  <div class="steps">
    <div class="step done">
      <div class="num"><b>01</b><em>choose</em></div>
      <div class="name">选科室</div>
      <div class="desc">按身体部位或症状匹配，避免挂错号</div>
      <span class="tag">已完成</span>
    </div>
    <div class="step now">
      <div class="num"><b>02</b><em>select</em></div>

<style>
  :root{
    --c-primary:#B8451F; --c-primary-dark:#8E3215;

    // 注入到 iframe
    Object.entries(templates).forEach(([fid, html]) => {
      const f = document.getElementById(fid);
      if (f) f.srcdoc = html;
    });

    // tab 切换
    const tabs = document.querySelectorAll('.tab');
    const frames = document.querySelectorAll('iframe');
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        frames.forEach(f => f.classList.remove('active'));
        tab.classList.add('active');
        const target = document.getElementById(tab.dataset.target);
        if (target) target.classList.add('active');
      });
    });

    // 键盘左右切换
    document.addEventListener('keydown', (e) => {
      const active = document.querySelector('.tab.active');
      if (!active) return;
      const all = Array.from(tabs);
      const idx = all.indexOf(active);
      if (e.key === 'ArrowRight' && idx < all.length - 1) all[idx + 1].click();
      else if (e.key === 'ArrowLeft' && idx > 0) all[idx - 1].click();
    });
